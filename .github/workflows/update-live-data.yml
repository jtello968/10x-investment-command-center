name: Update 10X live market data

on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Finnhub quotes and news
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          key = os.environ["FINNHUB_API_KEY"]

          tickers = [
              "RKLB",
              "ASTS",
              "IREN",
              "CRSP",
              "CAVA",
              "MELI",
              "OKLO"
          ]

          base = "https://finnhub.io/api/v1"

          def get(path, params):
              params["token"] = key

              url = (
                  base
                  + path
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "10X-Investment-Command-Center"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  return json.load(response)

          result = {
              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "quotes": {},

              "news": {}
          }

          for ticker in tickers:

              try:

                  quote = get(
                      "/quote",
                      {
                          "symbol": ticker
                      }
                  )

                  result["quotes"][ticker] = {

                      "current":
                          quote.get("c"),

                      "changePct":
                          quote.get("dp"),

                      "change":
                          quote.get("d"),

                      "previousClose":
                          quote.get("pc")
                  }

              except Exception as error:

                  result["quotes"][ticker] = {
                      "error": str(error)
                  }


              try:

                  end = datetime.now(
                      timezone.utc
                  ).date()

                  start = (
                      end -
                      timedelta(days=7)
                  )

                  news = get(
                      "/company-news",
                      {
                          "symbol": ticker,
                          "from":
                              start.isoformat(),
                          "to":
                              end.isoformat()
                      }
                  )

                  clean = []

                  for item in news[:5]:

                      clean.append({

                          "headline":
                              item.get(
                                  "headline",
                                  ""
                              ),

                          "source":
                              item.get(
                                  "source",
                                  ""
                              ),

                          "url":
                              item.get(
                                  "url",
                                  ""
                              ),

                          "datetime":
                              item.get(
                                  "datetime",
                                  0
                              ),

                          "summary":
                              item.get(
                                  "summary",
                                  ""
                              )
                      })

                  result["news"][ticker] = clean

              except Exception:

                  result["news"][ticker] = []

              time.sleep(0.4)


          output = Path("data")

          output.mkdir(
              exist_ok=True
          )

          (
              output /
              "live-data.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Commit updated data
        run: |

          git config \
            user.name \
            "10X Command Center"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add data/live-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Update live market data"

          git push
