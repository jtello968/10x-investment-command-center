<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>10X Investment Command Center</title>
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="10X Command">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root{
    --bg: #0d1117; --panel: #131a24; --panel-2: #0f151e; --line: #232d3a; --line-soft: #1a2330;
    --ink: #e6ecf3; --ink-dim: #8b98a9; --ink-faint: #5b6675; --gold: #c9a227; --gold-soft: #7d692c;
    --buy: #3fb27f; --buy-bg: #10241c; --sell: #d1554a; --sell-bg: #2a1414;
    --hold: #4a90c9; --hold-bg: #101c28; --wait: #c98a2c; --wait-bg: #241a0e;
    --notrade: #6b7684; --notrade-bg: #171c22;
    --mono: 'SFMono-Regular', Consolas, Menlo, monospace; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{padding-bottom:60px;} a{color:var(--gold);}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  header.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0d1117 80%,rgba(13,17,23,0));backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 16px 10px;}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .brand h1{font-size:15px;letter-spacing:.3px;margin:0;font-weight:600;} .brand h1 span{color:var(--gold);}
  .datastrip{font-size:11px;color:var(--ink-faint);font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .datastrip b{color:var(--ink-dim);font-weight:500;}
  main{max-width:1180px;margin:0 auto;padding:16px;} section{margin-bottom:22px;}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-faint);margin:0 0 10px;font-weight:600;}
  .runbar{display:flex;gap:10px;align-items:stretch;margin-top:12px;flex-wrap:wrap;}
  .runbtn{flex:1 1 220px;background:var(--gold);color:#1a1400;border:none;border-radius:6px;padding:14px 18px;font-size:14px;font-weight:700;letter-spacing:.4px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.25) inset;}
  .runbtn:disabled{opacity:.55;cursor:progress;}
  .runbtn:hover:not(:disabled){filter:brightness(1.08);}
  .ghostbtn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:6px;padding:14px 16px;font-size:13px;cursor:pointer;}
  .ghostbtn:hover{border-color:var(--gold-soft);color:var(--ink);}
  .posture{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--panel);margin-top:14px;}
  .posture .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);}
  .posture .val{font-size:20px;font-weight:700;margin-top:4px;}
  .posture-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;}
  @media(min-width:720px){.posture-grid{grid-template-columns:1fr 1fr;}}
  .posture-block h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);}
  .posture-block p{margin:0;font-size:13px;color:var(--ink-dim);line-height:1.5;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;} @media(min-width:640px){.cards{grid-template-columns:repeat(4,1fr);}}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;}
  .card .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);} .card .v{font-size:17px;margin-top:4px;font-weight:600;}
  .v.pos{color:var(--buy);} .v.neg{color:var(--sell);}
  .rounds{display:grid;grid-template-columns:1fr;gap:10px;} @media(min-width:720px){.rounds{grid-template-columns:repeat(3,1fr);}}
  .round-card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;} .round-card h4{margin:0 0 8px;font-size:12px;color:var(--ink);}
  .round-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim);padding:3px 0;}
  .round-bar{height:5px;background:var(--line-soft);border-radius:3px;margin-top:8px;overflow:hidden;} .round-bar i{display:block;height:100%;background:var(--gold-soft);}
  .edit-inline{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:2px 6px;font-size:12px;width:90px;font-family:var(--mono);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);border-bottom:1px solid var(--line);padding:8px 8px;white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;}
  tbody tr:hover{background:var(--panel-2);cursor:pointer;} .wl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;}
  .b-BUY{background:var(--buy-bg);color:var(--buy);} .b-SELL{background:var(--sell-bg);color:var(--sell);}
  .b-HOLD{background:var(--hold-bg);color:var(--hold);} .b-WAIT{background:var(--wait-bg);color:var(--wait);}
  .b-NOTRADE{background:var(--notrade-bg);color:var(--notrade);} .b-NODATA{background:var(--panel-2);color:var(--ink-faint);border:1px dashed var(--line);}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .s-LIVE{background:var(--buy);} .s-STALE{background:var(--wait);} .s-NODATA{background:var(--ink-faint);}
  .ticker-cell{font-weight:700;} .ticker-cell small{display:block;font-weight:400;color:var(--ink-faint);font-size:10px;}
  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 12px;font-size:12.5px;cursor:pointer;}
  .btn:hover{border-color:var(--gold-soft);} .btn.primary{background:var(--gold);color:#1a1400;border:none;font-weight:700;}
  .btn.danger{color:var(--sell);border-color:var(--sell-bg);} .btn.small{padding:5px 9px;font-size:11.5px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input,select,textarea{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--sans);width:100%;}
  textarea{resize:vertical;min-height:56px;} label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .panel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,9,.72);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;padding:20px;margin:20px 0 60px;}
  .modal h3{margin:0 0 4px;font-size:16px;} .modal .sub{font-size:12px;color:var(--ink-faint);margin-bottom:16px;}
  .modal-close{position:sticky;float:right;top:0;background:none;border:none;color:var(--ink-faint);font-size:20px;cursor:pointer;}
  .thesis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0;} @media(min-width:600px){.thesis-grid{grid-template-columns:repeat(4,1fr);}}
  .tscore{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;background:var(--panel-2);}
  .tscore .n{font-size:18px;font-weight:700;font-family:var(--mono);} .tscore .l{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;margin-top:2px;}
  .bullbear{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px;} @media(min-width:600px){.bullbear{grid-template-columns:1fr 1fr;}}
  .bull-box{border:1px solid #1c3a2c;background:#0e1a14;border-radius:8px;padding:10px;} .bear-box{border:1px solid #3a1c1c;background:#1a0e0e;border-radius:8px;padding:10px;}
  .bull-box h5{color:var(--buy);margin:0 0 6px;font-size:11px;text-transform:uppercase;} .bear-box h5{color:var(--sell);margin:0 0 6px;font-size:11px;text-transform:uppercase;}
  .bull-box p,.bear-box p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .newsitem{border-bottom:1px solid var(--line-soft);padding:10px 0;} .newsitem:last-child{border-bottom:none;}
  .newsitem .h{font-size:13px;font-weight:600;} .newsitem .meta{font-size:10.5px;color:var(--ink-faint);margin:2px 0 5px;font-family:var(--mono);}
  .newsitem .s{font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .warn{border:1px solid var(--gold-soft);background:#1c1608;color:var(--wait);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
  .info{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
  .footer-note{text-align:center;color:var(--ink-faint);font-size:11px;margin-top:30px;padding:0 10px;line-height:1.6;}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>10X <span>INVESTMENT COMMAND CENTER</span></h1>
    <div class="row">
      <button class="ghostbtn" onclick="openSettings()">Settings</button>
    </div>
  </div>
  <div class="datastrip" id="dataStrip"></div>
</header>

<main>
  <section>
    <div class="posture" id="postureBox"></div>
    <div class="runbar">
      <button class="runbtn" id="runBtn" onclick="runToday()">RUN TODAY</button>
      <button class="ghostbtn" onclick="openTradeForm()">Record a Trade</button>
    </div>
    <div id="runError"></div>
  </section>

  <section><h2 class="sec">Portfolio</h2><div class="cards" id="summaryCards"></div></section>
  <section><h2 class="sec">Capital Rounds</h2><div class="rounds" id="roundsBox"></div></section>

  <section>
    <div class="row" style="justify-content:space-between;">
      <h2 class="sec" style="margin:0;">Watchlist</h2>
      <button class="btn small" onclick="openAddCompany()">+ Add Company</button>
    </div>
    <div class="wl-wrap"><table id="watchlistTable"></table></div>
  </section>

  <section><h2 class="sec">Positions</h2><div class="wl-wrap"><table id="positionsTable"></table></div></section>
  <section><h2 class="sec">Trade History</h2><div class="wl-wrap"><table id="historyTable"></table></div></section>
</main>

<div class="footer-note">Decision-support only. No trades are placed automatically. You execute all trades manually at Fidelity, then record them here.</div>

<div id="modalRoot"></div>

<script>
/* ---------------- STATE ---------------- */
const STORAGE_KEY = 'tenx-command-center-state-v1';
const DEFAULT_STATE = () => ({
  totalCapital: 35000,
  cash: 35000,
  rounds: {
    r1: {label:"Round 1 — Initial Positions", allocated: 20000},
    r2: {label:"Round 2 — Correction / Opportunity Fund", allocated: 9000},
    r3: {label:"Round 3 — Winner / Concentration Fund", allocated: 6000}
  },
  watchlist: [
    {ticker:"RKLB", name:"Rocket Lab", sector:"Space / Launch & Systems", type:"public"},
    {ticker:"ASTS", name:"AST SpaceMobile", sector:"Satellite / Direct-to-Device", type:"public"},
    {ticker:"SPCX", name:"SpaceX", sector:"Space / Launch", type:"private"},
    {ticker:"IREN", name:"IREN", sector:"Data Centers / Compute", type:"public"},
    {ticker:"CRSP", name:"CRISPR Therapeutics", sector:"Gene Editing / Biotech", type:"public"},
    {ticker:"CAVA", name:"CAVA Group", sector:"Restaurants / Fast Casual", type:"public"},
    {ticker:"MELI", name:"MercadoLibre", sector:"LatAm E-commerce / Fintech", type:"public"},
    {ticker:"OKLO", name:"Oklo", sector:"Advanced Nuclear / Energy", type:"public"}
  ],
  companyData: {},
  trades: [],
  lastRun: null
});
let state = null;
function loadState(){ try{ state = JSON.parse(localStorage.getItem(STORAGE_KEY)); if(!state) state = DEFAULT_STATE(); }catch(e){ state = DEFAULT_STATE(); } }
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ---------------- HELPERS ---------------- */
const fmt$ = n => (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtPct = n => (n>0?'+':'') + n.toFixed(1) + '%';
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function positions(){
  const pos = {};
  const sorted = [...state.trades].sort((a,b)=> new Date(a.date)-new Date(b.date));
  for(const t of sorted){
    if(!pos[t.ticker]) pos[t.ticker] = {shares:0, costBasis:0, realizedGL:0};
    const p = pos[t.ticker];
    if(t.action==='BUY'){ p.shares += t.shares; p.costBasis += t.amount; }
    else {
      const avgCost = p.shares>0 ? p.costBasis/p.shares : 0;
      const soldCB = avgCost * t.shares;
      p.realizedGL += (t.amount - soldCB);
      p.shares -= t.shares; p.costBasis -= soldCB;
      if(p.shares<0.0000001) p.shares=0; if(p.costBasis<0.0000001) p.costBasis=0;
    }
  }
  return pos;
}
function currentPrice(ticker){ const cd = state.companyData[ticker]; return (cd && typeof cd.price==='number') ? cd.price : null; }
function portfolioTotals(){
  const pos = positions(); let invested=0, marketValue=0, realized=0, staleOrMissing=false;
  for(const t in pos){ const p=pos[t]; if(p.shares<=0){ realized+=p.realizedGL; continue; }
    invested += p.costBasis; const price = currentPrice(t);
    if(price===null){ staleOrMissing=true; marketValue += p.costBasis; } else { marketValue += price*p.shares; }
    realized += p.realizedGL;
  }
  const unrealized = marketValue - invested;
  return {invested, marketValue, unrealized, realized, totalReturn: realized+unrealized, staleOrMissing, pos};
}
function roundUsage(){ const used={r1:0,r2:0,r3:0}; for(const t of state.trades){ const r=t.round||'r1'; used[r] += (t.action==='BUY'? t.amount : -t.amount); } return used; }
function dataAgeLabel(iso){ if(!iso) return null; const ms=Date.now()-new Date(iso).getTime(); const hrs=ms/3600000; if(hrs<1) return Math.round(ms/60000)+"m ago"; if(hrs<48) return hrs.toFixed(1)+"h ago"; return (hrs/24).toFixed(1)+"d ago"; }

/* ---------------- RENDER ---------------- */
function renderTop(){
  const strip = document.getElementById('dataStrip'); const lr = state.lastRun;
  if(!lr){ strip.innerHTML = `<span><b>Last Updated:</b> never — press RUN TODAY</span>`; }
  else { strip.innerHTML = `<span><b>Last Updated:</b> ${new Date(lr.runDate).toLocaleString()}</span><span><b>Data Age:</b> ${dataAgeLabel(lr.runDate)}</span><span><b>Source:</b> ${lr.dataSource||'—'}</span>`; }

  const box = document.getElementById('postureBox');
  if(!lr){ box.innerHTML = `<div class="label">Market Posture</div><div class="val" style="color:var(--notrade)">NO DATA — NO TRADE TODAY</div><div class="info" style="margin-top:12px;">Press RUN TODAY to fetch live prices and news from the backend.</div>`; return; }
  box.innerHTML = `<div class="label">Market Posture</div><div class="val">${escapeHtml(lr.marketPosture||'—')}</div>
    <div class="posture-grid">
      <div class="posture-block"><h4>Why Today?</h4><p>${escapeHtml(lr.whyToday||'—')}</p></div>
      <div class="posture-block"><h4>What Changed?</h4><p>${escapeHtml(lr.whatChanged||'—')}</p></div>
      <div class="posture-block"><h4>Risks</h4><p>${escapeHtml(lr.risksToday||'—')}</p></div>
      <div class="posture-block"><h4>Watch Next</h4><p>${escapeHtml(lr.watchNext||'—')}</p></div>
    </div>`;
}
function renderSummary(){
  const t = portfolioTotals();
  const cards = [
    ['Total Capital', fmt$(state.totalCapital), ''], ['Invested Capital', fmt$(t.invested), ''],
    ['Cash / Reserve', fmt$(state.cash), ''], ['Portfolio Value', fmt$(t.marketValue)+(t.staleOrMissing?' *':''), ''],
    ['Unrealized G/L', fmt$(t.unrealized), t.unrealized>=0?'pos':'neg'], ['Realized G/L', fmt$(t.realized), t.realized>=0?'pos':'neg'],
    ['Total Return', fmt$(t.totalReturn), t.totalReturn>=0?'pos':'neg'],
    ['Return %', state.totalCapital? fmtPct(100*t.totalReturn/state.totalCapital):'—%', t.totalReturn>=0?'pos':'neg'],
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join('')
    + (t.staleOrMissing? `<div class="warn" style="grid-column:1/-1;">* One or more positions have no live price on file — cost basis used until you Run Today.</div>`:'');
}
function renderRounds(){
  const used = roundUsage();
  document.getElementById('roundsBox').innerHTML = Object.entries(state.rounds).map(([key,r])=>{
    const u = used[key]||0; const remaining = r.allocated-u; const pct = r.allocated>0? Math.min(100,Math.max(0,(u/r.allocated)*100)):0;
    return `<div class="round-card"><h4>${escapeHtml(r.label)}</h4>
      <div class="round-row"><span>Allocated</span><span class="num"><input class="edit-inline" type="number" value="${r.allocated}" onchange="updateRoundAllocated('${key}', this.value)"></span></div>
      <div class="round-row"><span>Used</span><span class="num">${fmt$(u)}</span></div>
      <div class="round-row"><span>Remaining</span><span class="num" style="color:${remaining<0?'var(--sell)':'var(--ink)'}">${fmt$(remaining)}</span></div>
      <div class="round-bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}
function updateRoundAllocated(key,val){ state.rounds[key].allocated = parseFloat(val)||0; saveState(); renderRounds(); }

function statusDot(status){ if(!status) return ''; const cls = status==='LIVE'?'s-LIVE':status==='STALE'?'s-STALE':'s-NODATA'; return `<span class="status-dot ${cls}"></span>${status}`; }
function badgeFor(rec, status){
  if(!status || status==='NO DATA') return `<span class="badge b-NODATA">NO DATA</span>`;
  if(!rec) return `<span class="badge b-NOTRADE">NO TRADE TODAY</span>`;
  const map = {BUY:'b-BUY',SELL:'b-SELL',HOLD:'b-HOLD',WAIT:'b-WAIT','NO TRADE TODAY':'b-NOTRADE'};
  return `<span class="badge ${map[rec]||'b-NOTRADE'}">${rec}</span>`;
}
function renderWatchlist(){
  const rows = state.watchlist.map(w=>{
    const cd = state.companyData[w.ticker] || {};
    const priceStr = w.type!=='public' ? 'PRIVATE' : (typeof cd.price==='number' ? '$'+cd.price.toFixed(2) : 'NO DATA');
    const chgStr = typeof cd.change==='number' ? `<span class="num" style="color:${cd.change>=0?'var(--buy)':'var(--sell)'}">${fmtPct(cd.change)}</span>` : '<span class="num" style="color:var(--ink-faint)">—</span>';
    const score = typeof cd.score==='number' ? cd.score : null;
    return `<tr onclick="openCompany('${w.ticker}')">
      <td class="ticker-cell">${w.ticker}<small>${escapeHtml(w.name)}</small></td>
      <td>${escapeHtml(w.sector||'')}</td>
      <td style="font-size:11px;">${w.type==='private'?'PRIVATE':statusDot(cd.status)}</td>
      <td class="num">${priceStr}</td>
      <td>${chgStr}</td>
      <td class="num">${score!==null? score+'/100':'—'}</td>
      <td>${badgeFor(cd.recommendation, w.type==='private'?'PRIVATE':cd.status)}</td>
      <td class="num">${cd.recommendation==='BUY' && cd.suggestedAmount ? fmt$(cd.suggestedAmount) : '$0'}</td>
      <td>${cd.confidence?escapeHtml(cd.confidence):'—'}</td>
      <td><button class="btn small" onclick="event.stopPropagation();removeCompany('${w.ticker}')">Remove</button></td>
    </tr>`;
  }).join('');
  document.getElementById('watchlistTable').innerHTML = `<thead><tr><th>Ticker</th><th>Sector</th><th>Status</th><th>Price</th><th>Chg</th><th>10X Score</th><th>Rec.</th><th>Suggested</th><th>Confidence</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="10" style="color:var(--ink-faint);">Watchlist is empty.</td></tr>'}</tbody>`;
}
function renderPositions(){
  const t = portfolioTotals();
  const rows = Object.entries(t.pos).filter(([_,p])=>p.shares>0.0000001).map(([ticker,p])=>{
    const avgCost = p.costBasis/p.shares; const price = currentPrice(ticker); const mv = price!==null? price*p.shares : p.costBasis;
    const ugl = mv-p.costBasis; const uglPct = p.costBasis? (ugl/p.costBasis*100):0; const pctPort = t.marketValue? (mv/t.marketValue*100):0;
    return `<tr onclick="openCompany('${ticker}')">
      <td class="ticker-cell">${ticker}</td><td class="num">${p.shares.toLocaleString('en-US',{maximumFractionDigits:4})}</td>
      <td class="num">$${avgCost.toFixed(2)}</td><td class="num">${price!==null?'$'+price.toFixed(2):'NO DATA'}</td>
      <td class="num">${fmt$(p.costBasis)}</td><td class="num">${fmt$(mv)}</td>
      <td class="num" style="color:${ugl>=0?'var(--buy)':'var(--sell)'}">${fmt$(ugl)}</td>
      <td class="num" style="color:${ugl>=0?'var(--buy)':'var(--sell)'}">${fmtPct(uglPct)}</td>
      <td class="num">${pctPort.toFixed(1)}%</td></tr>`;
  }).join('');
  document.getElementById('positionsTable').innerHTML = `<thead><tr><th>Ticker</th><th>Shares</th><th>Avg Cost</th><th>Price</th><th>Cost Basis</th><th>Mkt Value</th><th>Unreal. G/L</th><th>Unreal. %</th><th>Port. %</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="9" style="color:var(--ink-faint);">No open positions.</td></tr>'}</tbody>`;
}
function renderHistory(){
  const rows = [...state.trades].sort((a,b)=> new Date(b.date)-new Date(a.date)).map(t=>`<tr>
    <td class="num">${t.date}</td><td class="ticker-cell">${t.ticker}</td>
    <td><span class="badge ${t.action==='BUY'?'b-BUY':'b-SELL'}">${t.action}</span></td>
    <td class="num">${t.shares.toLocaleString('en-US',{maximumFractionDigits:4})}</td><td class="num">$${t.price.toFixed(2)}</td>
    <td class="num">${fmt$(t.amount)}</td><td class="num" style="color:${(t.realizedGL||0)>=0?'var(--buy)':'var(--sell)'}">${t.action==='SELL'?fmt$(t.realizedGL||0):'—'}</td>
    <td><button class="btn small danger" onclick="deleteTrade('${t.id}')">Delete</button></td></tr>`).join('');
  document.getElementById('historyTable').innerHTML = `<thead><tr><th>Date</th><th>Ticker</th><th>Action</th><th>Shares</th><th>Price</th><th>Amount</th><th>Realized G/L</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" style="color:var(--ink-faint);">No trades recorded yet.</td></tr>'}</tbody>`;
}
function deleteTrade(id){ if(!confirm('Delete this trade?')) return; state.trades = state.trades.filter(t=>t.id!==id); saveState(); renderAll(); }

/* ---------------- RUN TODAY (real backend call) ---------------- */
async function runToday(){
  const btn = document.getElementById('runBtn');
  btn.disabled = true; btn.textContent = 'ANALYZING…';
  document.getElementById('runError').innerHTML = '';
  try{
    const pos = positions();
    const heldTickers = Object.entries(pos).filter(([_,p])=>p.shares>0.0000001).map(([t])=>t);
    const resp = await fetch('/api/run-today', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        watchlist: state.watchlist.map(w=>({ticker:w.ticker, type:w.type})),
        availableCash: state.cash,
        heldTickers
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({error:'Request failed ('+resp.status+')'}));
      throw new Error(err.error || 'Request failed');
    }
    const data = await resp.json();
    state.lastRun = {
      runDate: data.runDate, dataSource: data.dataSource, marketPosture: data.marketPosture,
      whyToday: data.whyToday, whatChanged: data.whatChanged, risksToday: data.risksToday, watchNext: data.watchNext
    };
    for(const ticker in data.companies){
      state.companyData[ticker] = Object.assign(state.companyData[ticker]||{}, data.companies[ticker]);
    }
    saveState(); renderAll();
  } catch(e){
    document.getElementById('runError').innerHTML = `<div class="warn">Run Today failed: ${escapeHtml(e.message)}. No data was changed.</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'RUN TODAY';
  }
}

/* ---------------- MODALS: company detail, add/remove, trades, settings ---------------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openCompany(ticker){
  const w = state.watchlist.find(x=>x.ticker===ticker); if(!w) return;
  const cd = state.companyData[ticker] || {};
  const sb = cd.scoreBreakdown || {};
  const scoreFields = [['momentum','Momentum'],['valuation','Valuation'],['analystSentiment','Analyst Sentiment']];
  const news = cd.news||[];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h3>${ticker} — ${escapeHtml(w.name)}</h3>
        <div class="sub">${escapeHtml(w.sector||'')} · ${w.type==='private'?'Private company':statusDot(cd.status)} ${cd.asOf?(' · '+new Date(cd.asOf).toLocaleString()):''}</div>
        <div class="row" style="margin-bottom:14px;">
          <div class="card" style="flex:1;"><div class="k">Price</div><div class="v">${w.type!=='public'?'PRIVATE':(typeof cd.price==='number'?'$'+cd.price.toFixed(2):'NO DATA')}</div></div>
          <div class="card" style="flex:1;"><div class="k">10X Score</div><div class="v">${typeof cd.score==='number'?cd.score+'/100':'—'}</div></div>
          <div class="card" style="flex:1;"><div class="k">Recommendation</div><div class="v">${badgeFor(cd.recommendation, w.type==='private'?'PRIVATE':cd.status)}</div></div>
          <div class="card" style="flex:1;"><div class="k">Suggested $</div><div class="v">${cd.suggestedAmount?fmt$(cd.suggestedAmount):'$0'}</div></div>
        </div>
        <div class="panel" style="margin-bottom:14px;"><label>Why this recommendation</label><p style="margin:0;font-size:13px;color:var(--ink-dim);">${escapeHtml(cd.reason||'Run Today to generate a live explanation.')}</p></div>
        <h4 style="font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-faint);margin:0 0 8px;">Score Factors (0–100, only what's actually available)</h4>
        <div class="thesis-grid">${scoreFields.map(([k,l])=>`<div class="tscore"><div class="n">${typeof sb[k]==='number'? Math.round(sb[k]) : '—'}</div><div class="l">${l}</div></div>`).join('')}</div>
        <div class="bullbear">
          <div class="bull-box"><h5>Bull Case (your notes)</h5><textarea onchange="updateCompanyField('${ticker}','bull', this.value)">${escapeHtml(cd.bull||'')}</textarea></div>
          <div class="bear-box"><h5>Bear Case (your notes)</h5><textarea onchange="updateCompanyField('${ticker}','bear', this.value)">${escapeHtml(cd.bear||'')}</textarea></div>
        </div>
        <h4 style="font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-faint);margin:16px 0 8px;">Recent News</h4>
        ${news.length? news.map(n=>`<div class="newsitem"><div class="h">${escapeHtml(n.headline)}</div><div class="meta">${escapeHtml(n.source||'')} · ${escapeHtml(n.date||'')}</div><div class="s">${escapeHtml(n.summary||'')} ${n.link?`— <a href="${n.link}" target="_blank" rel="noopener">source</a>`:''}</div></div>`).join('') : '<div class="info">No news on file — run today to fetch it.</div>'}
        <div class="row" style="margin-top:16px;justify-content:flex-end;">
          <button class="btn primary" onclick="closeModal();openTradeForm('${ticker}')">Record Trade for ${ticker}</button>
        </div>
      </div>
    </div>`;
}
function updateCompanyField(ticker, field, value){ if(!state.companyData[ticker]) state.companyData[ticker]={}; state.companyData[ticker][field]=value; saveState(); }

function openAddCompany(){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:460px;">
    <button class="modal-close" onclick="closeModal()">&times;</button><h3>Add Company</h3>
    <div class="field"><label>Ticker</label><input id="acTicker" placeholder="e.g. NVDA"></div>
    <div class="field"><label>Name</label><input id="acName" placeholder="Company name"></div>
    <div class="field"><label>Sector</label><input id="acSector" placeholder="e.g. Semiconductors"></div>
    <div class="field"><label>Type</label><select id="acType"><option value="public">Public</option><option value="private">Private</option></select></div>
    <button class="btn primary" onclick="addCompany()" style="width:100%;">Add to Watchlist</button></div></div>`;
}
function addCompany(){
  const ticker = document.getElementById('acTicker').value.trim().toUpperCase(); if(!ticker) return;
  if(state.watchlist.some(w=>w.ticker===ticker)){ alert('Already on watchlist.'); return; }
  state.watchlist.push({ticker, name: document.getElementById('acName').value.trim()||ticker, sector: document.getElementById('acSector').value.trim(), type: document.getElementById('acType').value});
  saveState(); closeModal(); renderAll();
}
function removeCompany(ticker){ if(!confirm('Remove '+ticker+' from the watchlist?')) return; state.watchlist = state.watchlist.filter(w=>w.ticker!==ticker); saveState(); renderAll(); }

function openTradeForm(presetTicker){
  const opts = state.watchlist.filter(w=>w.type==='public').map(w=>`<option value="${w.ticker}" ${presetTicker===w.ticker?'selected':''}>${w.ticker} — ${escapeHtml(w.name)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:480px;">
    <button class="modal-close" onclick="closeModal()">&times;</button><h3>Record a Trade</h3>
    <div class="sub">This only updates your tracked portfolio. Execute the actual trade at Fidelity first.</div>
    <div class="grid2"><div class="field"><label>Date</label><input id="trDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Ticker</label><select id="trTicker">${opts}</select></div></div>
    <div class="grid2"><div class="field"><label>Action</label><select id="trAction"><option>BUY</option><option>SELL</option></select></div>
    <div class="field"><label>Round</label><select id="trRound">${Object.entries(state.rounds).map(([k,r])=>`<option value="${k}">${escapeHtml(r.label)}</option>`).join('')}</select></div></div>
    <div class="grid2"><div class="field"><label>Dollar Amount</label><input id="trAmount" type="number" step="0.01" oninput="syncTradeShares('amount')"></div>
    <div class="field"><label>Price per Share</label><input id="trPrice" type="number" step="0.0001" oninput="syncTradeShares('price')"></div></div>
    <div class="field"><label>Shares (auto, editable)</label><input id="trShares" type="number" step="0.0001" oninput="syncTradeShares('shares')"></div>
    <button class="btn primary" onclick="submitTrade()" style="width:100%;">Save Trade</button></div></div>`;
}
function syncTradeShares(changed){
  const amt = parseFloat(document.getElementById('trAmount').value); const price = parseFloat(document.getElementById('trPrice').value); const sharesEl = document.getElementById('trShares');
  if(changed!=='shares' && amt>0 && price>0) sharesEl.value = (amt/price).toFixed(4);
  if(changed==='shares'){ const shares = parseFloat(sharesEl.value); if(shares>0 && price>0) document.getElementById('trAmount').value = (shares*price).toFixed(2); }
}
function submitTrade(){
  const date = document.getElementById('trDate').value, ticker = document.getElementById('trTicker').value, action = document.getElementById('trAction').value, round = document.getElementById('trRound').value;
  const amount = parseFloat(document.getElementById('trAmount').value), price = parseFloat(document.getElementById('trPrice').value);
  let shares = parseFloat(document.getElementById('trShares').value);
  if(!date || !ticker || !amount || !price){ alert('Fill in date, amount and price.'); return; }
  if(!shares) shares = amount/price;
  if(action==='BUY' && amount > state.cash){ if(!confirm(`This exceeds available cash (${fmt$(state.cash)}). Record anyway?`)) return; }
  if(action==='SELL'){ const held = (positions()[ticker]||{shares:0}).shares; if(shares > held+0.0001){ if(!confirm(`Selling more (${shares}) than held (${held.toFixed(4)}). Record anyway?`)) return; } }
  let realizedGL = 0;
  if(action==='SELL'){ const p = positions()[ticker]; const avgCost = p && p.shares>0 ? p.costBasis/p.shares : 0; realizedGL = amount - (avgCost*shares); }
  state.trades.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,7), date, ticker, action, amount, price, shares, realizedGL, round});
  state.cash += action==='BUY' ? -amount : amount;
  saveState(); closeModal(); renderAll();
}

function openSettings(){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:480px;">
    <button class="modal-close" onclick="closeModal()">&times;</button><h3>Settings</h3>
    <div class="field"><label>Total Capital</label><input id="stCapital" type="number" value="${state.totalCapital}"></div>
    <div class="info">Changing this adjusts cash/reserve by the delta. Positions and history are untouched.</div>
    <button class="btn primary" onclick="saveCapital()" style="width:100%;margin-bottom:20px;">Save Capital</button>
    <div class="field"><label>Backup</label><button class="btn" style="width:100%;" onclick="exportData()">Copy JSON to clipboard</button></div>
    <div class="field"><label>Danger zone</label><button class="btn danger" style="width:100%;" onclick="resetAll()">Reset all data</button></div>
    </div></div>`;
}
function saveCapital(){ const newCap = parseFloat(document.getElementById('stCapital').value)||0; const delta = newCap - state.totalCapital; state.totalCapital = newCap; state.cash += delta; saveState(); closeModal(); renderAll(); }
function exportData(){ navigator.clipboard.writeText(JSON.stringify(state,null,2)).then(()=>alert('Copied.')); }
function resetAll(){ if(!confirm('Wipe all data?')) return; state = DEFAULT_STATE(); saveState(); closeModal(); renderAll(); }

function renderAll(){ renderTop(); renderSummary(); renderRounds(); renderWatchlist(); renderPositions(); renderHistory(); }

loadState(); renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}
</script>
</body>
